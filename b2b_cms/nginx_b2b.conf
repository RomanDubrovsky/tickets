# ==========================================
# b2b_cms: Nginx Virtual Hosts Configuration
# ==========================================

# 1. Рок Хит Нева
server {
    listen 80;
    listen 8082;
    server_name rockhitneva.ru www.rockhitneva.ru rockhit.public-health-ai.ru;

    location /static/ {
        alias /home/ubuntu/b2b_cms/static_assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    root /home/ubuntu/b2b_cms/dist/rockhitneva.ru;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

